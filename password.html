<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set new password · COMRADE CYBER</title>
<style>
body{margin:0;background:linear-gradient(120deg,#32106d,#6d28d9 65%,#8b5cf6);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#211638}
.card{width:100%;max-width:440px;background:#fff;border-radius:20px;padding:34px 30px;box-shadow:0 20px 60px #1e0b4f4d}
h1{margin:0 0 6px;font-size:22px;color:#32106d}
.sub{color:#6b6479;font-size:13px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:13px}
.field input{border:1px solid #d9d1e8;border-radius:10px;padding:12px;font:inherit;width:100%}
.btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;background:#5b21b6;color:#fff;cursor:pointer}
.btn:disabled{opacity:.6}
.notice{padding:11px 13px;border-radius:10px;background:#f0eaff;color:#3d176d;margin:12px 0;font-size:13px}
.notice.error{background:#fee2e2;color:#991b1b}
.notice.ok{background:#dcfce7;color:#166534}
.hidden{display:none!important}
.foot{color:#6b6479;font-size:12px;margin-top:16px;text-align:center}
.foot a{color:#5b21b6;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <div class="sub">Enter your new password below.</div>

  <div id="statusNotice" class="notice hidden"></div>

  <form id="resetForm">
    <div class="field"><label>New password</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="field"><label>Confirm new password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div>
    <button type="submit" class="btn">Save new password</button>
    <div id="resetMessage"></div>
  </form>

  <div class="foot"><a href="login.html">← Back to sign in</a></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const SUPABASE_URL      = "https://vebfwxpacvzcnsflulrg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IFrnG1B_XQ_DW2EwlH2Qig_ocV1H6ft";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
});

const $ = id => document.getElementById(id);
const LOGIN_PAGE = "login.html";

function showStatus(msg, type){
  const s = $("statusNotice");
  s.className = "notice" + (type ? " " + type : "");
  s.textContent = msg;
  s.classList.remove("hidden");
}

/* Listen for the recovery event */
supabase.auth.onAuthStateChange((event) => {
  if(event === "PASSWORD_RECOVERY"){
    showStatus("Reset link verified. Enter your new password below.", "ok");
  }
});

/* Detect token in URL */
const hash = window.location.hash || "";
const code = new URLSearchParams(window.location.search).get("code");

if(code){
  supabase.auth.exchangeCodeForSession(code).then(({ error }) => {
    if(error) showStatus("This reset link is invalid or has expired. Please request a new one.", "error");
    else showStatus("Reset link verified. Enter your new password below.", "ok");
  });
} else if(hash.includes("access_token") || hash.includes("type=recovery")){
  showStatus("Verifying reset link…");
  setTimeout(() => {
    if($("statusNotice").textContent === "Verifying reset link…"){
      showStatus("Reset link could not be verified. Request a new one from the sign-in page.", "error");
    }
  }, 2500);
} else {
  showStatus("No reset token found. Please click the link from your reset email.", "error");
}

$("resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  const msg = $("resetMessage");
  msg.className = "";
  msg.textContent = "";
  try{
    const p1 = $("newPassword").value;
    const p2 = $("confirmPassword").value;
    if(p1.length < 8) throw new Error("Password must be at least 8 characters.");
    if(p1 !== p2) throw new Error("Passwords do not match.");
    if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }

    const { error } = await supabase.auth.updateUser({ password: p1 });
    if(error) throw error;

    msg.className = "notice ok";
    msg.textContent = "Password updated. Redirecting to sign in…";
    setTimeout(async () => {
      await supabase.auth.signOut();
      window.location.replace(LOGIN_PAGE);
    }, 1500);
  }catch(err){
    msg.className = "notice error";
    msg.textContent = err.message;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Save new password"; }
  }
});
</script>
</body>
</html>


<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Alupe University</title>
<link href="dist/images/alupeLogo.jpg" rel="icon"/>
<link href="npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="dist/css/authentication_v_2.css" rel="stylesheet"/>
</head>
<body>
<div class="auth-wrapper">
<!-- Left brand panel -->
<div class="brand-panel">
<div class="brand-ring-inner"></div>
<div class="brand-logo-wrap">
<img alt="Alupe University Logo" src="dist/images/alupeLogo.jpg"/>
</div>
<div class="brand-university-name">ALUPE UNIVERSITY</div>
<div class="brand-divider"></div>
<div class="brand-slogan">“The Bastion of Knowledge”</div>
<div class="brand-dots">
<span></span><span></span><span></span>
</div>
</div>
<!-- Right form panel -->
<div class="form-panel">
<div class="form-panel-header">
<h2>Welcome Back</h2>
<p>Sign in to access your student portal</p>
</div>
<form action="https://portal.au.ac.ke/" class="needs-validation" method="post" novalidate="novalidate"><input name="__RequestVerificationToken" type="hidden" value="BBO0RE5eU9pBI_twBauEWEOlmZ1FhCUrWVhkTkf3BGrX0EQIRQCU2aua3SMoNr1CCPzmlKRHxQsF3rWFmGU_gMcpWibIYbWklgvGNp3i4Es1"/> <div class="field-group">
<label class="form-label" for="Username">Student Number</label>
<div class="input-icon-container">
<i class="bi bi-person input-icon"></i>
<input class="form-control text-box single-line" data-val="true" data-val-length="Username must be between 5 and 40 characters." data-val-length-max="40" data-val-length-min="1" data-val-required="The Student Number field is required." id="Username" name="Username" placeholder="Enter student number" required="required" type="text" value=""/>
</div>
<span class="field-validation-valid field-error" data-valmsg-for="Username" data-valmsg-replace="true"></span>
</div>
<div class="field-group">
<label class="form-label" for="Password">Password</label>
<div class="input-icon-container">
<i class="bi bi-lock input-icon"></i>
<input class="form-control has-toggle" data-val="true" data-val-length="Password must be at least 8 characters long." data-val-length-max="75" data-val-length-min="4" data-val-required="The Password field is required." id="Password" maxlength="15" minlength="4" name="Password" placeholder="Enter your password" required="required" type="password"/>
<button aria-label="Show password" class="password-toggle" tabindex="-1" type="button">
<i class="bi bi-eye"></i>
</button>
</div>
<span class="field-validation-valid field-error" data-valmsg-for="Password" data-valmsg-replace="true"></span>
</div>
<button class="btn-auth" type="submit">
<i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
<div class="form-links">
<a class="auth-link" href="#">
<i class="bi bi-clipboard2-check"></i> Join University
                    </a>
<a class="auth-link" href="https://portal.au.ac.ke/authentication/ForgotPassword">
<i class="bi bi-question-circle"></i> Forgot Password?
                    </a>
</div>
</form>
<div class="form-footer">
                © 2026 Alupe University — Engineered by
                <a href="https://appkings.co.ke/" target="_blank">Appkings Solutions</a>
</div>
</div>
</div>
<script src="npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.getElementsByClassName('needs-validation');
                Array.prototype.filter.call(forms, function (form) {
                    form.addEventListener('submit', function (event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();

        // Show / hide password
        document.querySelectorAll('.password-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var container = btn.closest('.input-icon-container');
                var input = container ? container.querySelector('input') : null;
                if (!input) return;
                var reveal = input.type === 'password';
                input.type = reveal ? 'text' : 'password';
                var icon = btn.querySelector('i');
                if (icon) icon.className = reveal ? 'bi bi-eye-slash' : 'bi bi-eye';
                btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
            });
        });
    </script>
</body>
</html>
